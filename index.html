<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Personal Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="header-left">
      <div id="datetime" class="datetime"></div>
      <div id="greeting" class="greeting"></div>
    </div>
    <div class="header-right">
      <!-- Challenge: Custom name -->
      <button id="btn-name" class="btn-icon" title="Set your name">✏️</button>
      <!-- Challenge: Light/Dark mode -->
      <button id="btn-theme" class="btn-icon" title="Toggle theme">🌙</button>
    </div>
  </header>

  <!-- ===== MAIN GRID ===== -->
  <main class="grid">

    <!-- ── FOCUS TIMER ── -->
    <section class="card" id="timer-card">
      <h2 class="card-title">⏱ Focus Timer</h2>

      <div class="timer-display" id="timer-display">25:00</div>

      <div class="timer-controls">
        <button class="btn btn-primary" id="btn-start">Start</button>
        <button class="btn btn-secondary" id="btn-stop">Stop</button>
        <button class="btn btn-secondary" id="btn-reset">Reset</button>
      </div>

      <!-- Challenge: Change Pomodoro time (removed per user's chosen 3) -->
      <!-- Keeping just the default 25 min unless user wants to change it -->
      <div class="timer-minutes-row">
        <label for="timer-minutes">Set minutes:</label>
        <input type="number" id="timer-minutes" min="1" max="99" value="25" />
        <button class="btn btn-sm" id="btn-set-time">Set</button>
      </div>
    </section>

    <!-- ── TO-DO LIST ── -->
    <section class="card" id="todo-card">
      <h2 class="card-title">✅ To-Do List</h2>

      <div class="todo-input-row">
        <input type="text" id="todo-input" placeholder="Add a new task…" />
        <button class="btn btn-primary" id="btn-add-task">Add</button>
      </div>

      <div class="todo-sort-row">
        <label for="todo-sort">Sort:</label>
        <select id="todo-sort">
          <option value="default">Default</option>
          <option value="az">A → Z</option>
          <option value="za">Z → A</option>
          <option value="done">Done last</option>
        </select>
      </div>

      <p id="todo-duplicate-msg" class="error-msg hidden">⚠️ Task already exists!</p>

      <ul id="todo-list" class="todo-list"></ul>
    </section>

    <!-- ── QUICK LINKS ── -->
    <section class="card" id="links-card">
      <h2 class="card-title">🔗 Quick Links</h2>

      <div class="links-input-row">
        <input type="text" id="link-name-input" placeholder="Name" />
        <input type="url"  id="link-url-input"  placeholder="https://…" />
        <button class="btn btn-primary" id="btn-add-link">Add</button>
      </div>

      <div id="links-grid" class="links-grid"></div>
    </section>

  </main>

  <!-- ===== MODALS ===== -->

  <!-- Name Modal -->
  <div id="modal-name" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-name-title">
    <div class="modal-box">
      <h3 id="modal-name-title">What's your name?</h3>
      <input type="text" id="name-input" placeholder="Enter your name…" maxlength="40" />
      <div class="modal-actions">
        <button class="btn btn-primary" id="btn-save-name">Save</button>
        <button class="btn btn-secondary" id="btn-cancel-name">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Edit Task Modal -->
  <div id="modal-edit-task" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-edit-title">
    <div class="modal-box">
      <h3 id="modal-edit-title">Edit Task</h3>
      <input type="text" id="edit-task-input" placeholder="Task name…" maxlength="200" />
      <div class="modal-actions">
        <button class="btn btn-primary" id="btn-save-edit-task">Save</button>
        <button class="btn btn-secondary" id="btn-cancel-edit-task">Cancel</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay hidden" id="modal-overlay"></div>

  <script src="js/app.js"></script>
</body>
</html>
